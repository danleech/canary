# Source domains Canary treats as known-good. `canary.py check` WARNS (never errors) when a
# signal cites a domain outside this list, so a human can look before it becomes habit.
#
# Why: Canary is a shortcut other AI agents trust. Someone who wants to flip a status, or
# smuggle instructions into agents' context windows, has to get a source cited first. Keeping
# citations to established outlets and official bodies makes that much harder.
#
# Matching is by suffix: "gov.uk" covers www.gov.uk and assets.publishing.service.gov.uk.
# Bare TLD-like entries ("gov", "int", "mil") cover every host under them.
# To add a domain: confirm it is an established outlet, official body or primary data source.
#
# Rules that use this list (canary.py):
#   - A judged Alert (basis "judged", status red) must cite at least two independent outlets
#     (different registrable domains), and at least one of them must be on this list. Errors.
#   - Any other untrusted domain only warns, so a human can review it before it becomes habit.
#   - Domains under `avoid` are rejected outright in new assessments: they are not sources of
#     record (tertiary encyclopedias, self-publishing platforms, social media, forums). Cite the
#     original reporting or the official body instead. Existing citations only warn until refreshed.
#   - `official` suffixes are exempt from the per-run outlet concentration check, because many
#     signals legitimately cite the same agency (WHO, NOAA) or data feed.

domains:
  # Governments, militaries, treaty bodies (suffixes)
  - gov
  - mil
  - int
  - gov.uk
  - europa.eu
  - un.org
  - parliament.uk
